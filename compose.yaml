name: education

services:
  db-primary:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db-primary
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Minsk
    ports:
      - "1434:1433"
    volumes:
      - primary-data:/var/opt/mssql
    networks:
      - education-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-replica:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db-replica
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Minsk
    ports:
      - "1435:1433"
    volumes:
      - replica-data:/var/opt/mssql
    networks:
      - education-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    image: education-server:1.0
    container_name: education-server
    environment:
      Server__Port: "8080"
      TZ: Europe/Minsk
      ConnectionStrings__Primary: "Server=db-primary,1433;Database=EDUCATION;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Connect Timeout=3;Pooling=False;"
      ConnectionStrings__Replica: "Server=db-replica,1433;Database=EDUCATION_REPLICA;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Connect Timeout=3;Pooling=False;"
    ports:
      - "8080:8080"
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    networks:
      - education-net
    restart: unless-stopped

networks:
  education-net:
    name: education-net
    driver: bridge

volumes:
  primary-data:
  replica-data:
